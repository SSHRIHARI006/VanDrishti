<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6b62"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#ffffff"/>

  <rect x="20" y="140" width="170" height="90" rx="10" fill="#1f5f3a"/>
  <text x="105" y="176" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Browser dashboard</text>
  <text x="105" y="198" fill="#cfe6d5" font-size="12" text-anchor="middle">React + MapLibre</text>
  <text x="105" y="215" fill="#cfe6d5" font-size="12" text-anchor="middle">upload · live steps · map</text>

  <rect x="260" y="140" width="170" height="90" rx="10" fill="#e7f1e9" stroke="#2f7d4c"/>
  <text x="345" y="176" fill="#1f5f3a" font-size="15" font-weight="700" text-anchor="middle">API service</text>
  <text x="345" y="198" fill="#1b2a21" font-size="12" text-anchor="middle">FastAPI (Python)</text>
  <text x="345" y="215" fill="#1b2a21" font-size="12" text-anchor="middle">validates uploads, jobs</text>

  <rect x="500" y="140" width="190" height="90" rx="10" fill="#e7f1e9" stroke="#2f7d4c"/>
  <text x="595" y="176" fill="#1f5f3a" font-size="15" font-weight="700" text-anchor="middle">Pipeline worker</text>
  <text x="595" y="198" fill="#1b2a21" font-size="12" text-anchor="middle">8–10 stages per run</text>
  <text x="595" y="215" fill="#1b2a21" font-size="12" text-anchor="middle">events · confidence</text>

  <rect x="760" y="20" width="220" height="70" rx="10" fill="#e8f0fd" stroke="#2d6cdf"/>
  <text x="870" y="50" fill="#1f4a99" font-size="14" font-weight="700" text-anchor="middle">Google Earth Engine</text>
  <text x="870" y="70" fill="#1b2a21" font-size="12" text-anchor="middle">canopy height · Sentinel-2 · DEM</text>

  <rect x="760" y="110" width="220" height="60" rx="10" fill="#e8f0fd" stroke="#2d6cdf"/>
  <text x="870" y="137" fill="#1f4a99" font-size="14" font-weight="700" text-anchor="middle">DeepForest model</text>
  <text x="870" y="156" fill="#1b2a21" font-size="12" text-anchor="middle">crown detection (CPU)</text>

  <rect x="760" y="190" width="220" height="60" rx="10" fill="#e8f0fd" stroke="#2d6cdf"/>
  <text x="870" y="217" fill="#1f4a99" font-size="14" font-weight="700" text-anchor="middle">Regional species models</text>
  <text x="870" y="236" fill="#1b2a21" font-size="12" text-anchor="middle">used only inside their region</text>

  <rect x="430" y="290" width="330" height="70" rx="10" fill="#fafcfa" stroke="#dde5de"/>
  <text x="595" y="318" fill="#1b2a21" font-size="14" font-weight="700" text-anchor="middle">Job store: data/jobs/&lt;id&gt;/</text>
  <text x="595" y="338" fill="#5d6b62" font-size="12" text-anchor="middle">inputs · rasters · GeoJSON · reports · event log · cache</text>

  <rect x="20" y="290" width="330" height="70" rx="10" fill="#1f5f3a"/>
  <text x="185" y="318" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Existing systems</text>
  <text x="185" y="338" fill="#cfe6d5" font-size="12" text-anchor="middle">Google Earth (KMZ) · QGIS/ArcGIS · CSV · PDF · API</text>

  <g stroke="#5d6b62" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M190,172 L258,172"/>
    <path d="M258,200 L192,200"/>
    <path d="M430,185 L498,185"/>
    <path d="M690,165 C725,165 725,55 758,55"/>
    <path d="M690,180 L758,140"/>
    <path d="M690,195 L758,220"/>
    <path d="M595,230 L595,288"/>
    <path d="M430,325 L352,325"/>
  </g>
  <text x="224" y="163" fill="#5d6b62" font-size="11" text-anchor="middle">KML, files</text>
  <text x="224" y="216" fill="#5d6b62" font-size="11" text-anchor="middle">status, layers</text>
</svg>
